name: benchmark-full-matrix

on:
  workflow_dispatch:
    inputs:
      num_runs:
        description: "N for fresh-subprocess aggregator"
        required: true
        default: "20"
      stores:
        description: "space-separated store names (default: all Phase-1)"
        required: false
        default: ""
      scenarios:
        description: "space-separated scenario subdir prefixes (default: all)"
        required: false
        default: ""

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run matrix
        env:
          QUORIN_BENCH_REDIS_URL: redis://localhost:6379
        run: |
          ARGS="--phase 1 --num-runs ${{ github.event.inputs.num_runs }}"
          if [ -n "${{ github.event.inputs.stores }}" ]; then
            ARGS="$ARGS --stores ${{ github.event.inputs.stores }}"
          fi
          if [ -n "${{ github.event.inputs.scenarios }}" ]; then
            ARGS="$ARGS --scenarios ${{ github.event.inputs.scenarios }}"
          fi
          python -m runners.matrix_runner $ARGS

      - name: Render markdown summary
        run: |
          python -m analysis.render_table --scope full --write
          python -m analysis.render_table --scope headline > results/headline.md

      - name: Upload result JSONs
        uses: actions/upload-artifact@v4
        with:
          name: full-matrix-${{ github.run_id }}
          path: results/
          retention-days: 90
