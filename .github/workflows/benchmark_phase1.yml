name: benchmark-phase1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Lint (non-blocking)
        run: |
          pip install ruff==0.6.9
          ruff check . || true

      - name: Phase-1 matrix (N=5 in CI)
        env:
          QUORIN_BENCH_REDIS_URL: redis://localhost:6379
        run: |
          make benchmark-ci

      - name: Render markdown summary
        run: |
          python -m analysis.render_table --scope full --write
          python -m analysis.render_table --scope headline > results/headline.md
          cat results/headline.md

      - name: Upload result JSONs
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.run_id }}
          path: results/
          retention-days: 30

      # Phase-1 CI runs every push; we DO commit the JSONs back to main so
      # the README's headline table tracks the latest measurements. Skip
      # auto-commit on pull_request (read-only repo state).
      - name: Commit results back to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "no result changes"
          else
            git commit -m "ci: refresh Phase-1 results (run ${{ github.run_id }})"
            git push
          fi
